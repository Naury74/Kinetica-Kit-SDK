# 기본 규칙 위에 덮어쓰는 값만 둔다. 규칙을 끄거나 완화하려면 docs/adr에 이유를 남긴다.
style:
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    excludes: ['**/test/**', '**/testFixtures/**', '**/androidTest/**']
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
complexity:
  TooManyFunctions:
    # 저장 형식 변환은 필드 묶음마다 작은 함수 하나를 두는 편이 읽기 쉽다. ADR-0001 참고.
    thresholdInFiles: 20
    thresholdInClasses: 15
    thresholdInObjects: 15
  LongParameterList:
    ignoreAnnotated: ['Composable']
    excludes: ['**/test/**', '**/testFixtures/**', '**/androidTest/**']
