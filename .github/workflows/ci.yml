name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew check :sample-showcase:assembleDebug :sample-showcase:assembleRelease
      # 배포된 artifact만 쓰는 독립 소비자가 R8 release로 빌드되는지 확인한다(docs 20 Journey C).
      - run: ./gradlew publishToMavenLocal && ./gradlew -p consumer-check :app:assembleRelease
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/quality/
            **/build/reports/lint-results-*.html
          retention-days: 7
