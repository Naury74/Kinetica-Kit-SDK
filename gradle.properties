org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# 배포 좌표. SDK 모듈 전부가 같은 버전으로 배포된다. 배포 절차와 버전 규칙은 docs/publishing.md.
KINETICA_GROUP=com.naurylab
KINETICA_VERSION=1.0.0-alpha01
# 공식 배포 전에 다른 프로젝트가 받아 보는 개발 판의 버전. publishDev로만 쓰인다(docs/publishing.md).
KINETICA_DEV_VERSION=1.0.0-alpha02-SNAPSHOT

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
